name: Build and release plugins

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
          - platform: macos
            runner: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: linux
            runner: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test packaging
        run: python -m unittest discover -s packaging -p 'test_*.py'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libasound2-dev libgl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev \
            libxcb-dri3-dev libxcb-cursor-dev libxkbcommon-x11-dev libxcursor-dev

      - name: Install Windows installer compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Run tests
        if: github.ref_type != 'tag'
        run: cargo test --workspace --locked

      - name: Build Windows and Linux plugins
        if: matrix.platform != 'macos'
        run: cargo xtask bundle equart --release --locked

      - name: Build macOS Universal plugins
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: cargo xtask bundle-universal equart --release --locked

      - name: Build macOS Universal Audio Unit
        if: matrix.platform == 'macos'
        run: python tools/ci/build_au.py

      - name: Package and validate plugins
        run: python packaging/release.py "${{ matrix.platform }}"

      - name: Validate packaged Audio Unit
        if: matrix.platform == 'macos'
        run: python tools/ci/validate_au.py

      - uses: actions/upload-artifact@v7
        with:
          name: equart-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: equart-*
          path: dist
          merge-multiple: true

      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS dist/
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "EQuart $RELEASE_TAG" --generate-notes
